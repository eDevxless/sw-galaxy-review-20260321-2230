<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Planet Map Generator Frame</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020611;
    }

    body {
      position: relative;
    }

    #map-svg,
    #map-canvas,
    #img-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #img-canvas,
    #map-svg,
    .dg.ac {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <svg id="map-svg"></svg>
  <canvas id="map-canvas"></canvas>
  <canvas id="img-canvas"></canvas>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const requestId = params.get("requestId") || "";
      const seedInput = params.get("seed") || "planet-map-default";

      function xmur3(value) {
        let hash = 1779033703 ^ value.length;
        for (let index = 0; index < value.length; index += 1) {
          hash = Math.imul(hash ^ value.charCodeAt(index), 3432918353);
          hash = (hash << 13) | (hash >>> 19);
        }
        return function () {
          hash = Math.imul(hash ^ (hash >>> 16), 2246822507);
          hash = Math.imul(hash ^ (hash >>> 13), 3266489909);
          return (hash ^= hash >>> 16) >>> 0;
        };
      }

      function sfc32(a, b, c, d) {
        return function () {
          a >>>= 0;
          b >>>= 0;
          c >>>= 0;
          d >>>= 0;
          const temp = (a + b) | 0;
          a = b ^ (b >>> 9);
          b = (c + (c << 3)) | 0;
          c = (c << 21) | (c >>> 11);
          d = (d + 1) | 0;
          const result = (temp + d) | 0;
          c = (c + result) | 0;
          return (result >>> 0) / 4294967296;
        };
      }

      function seededRandomFactory(seedValue) {
        const seed = xmur3(String(seedValue));
        return sfc32(seed(), seed(), seed(), seed());
      }

      const seededRandom = seededRandomFactory(seedInput);
      Math.random = function () {
        return seededRandom();
      };

      function post(type, payload) {
        if (!window.parent || window.parent === window) return;
        const message = Object.assign(
          {
            type,
            requestId,
            seed: seedInput,
          },
          payload || {}
        );
        try {
          window.parent.postMessage(message, window.location.origin || "*");
        } catch (_error) {
          window.parent.postMessage(message, "*");
        }
      }

      function runWhenReady() {
        const instance = window.__MAP_GENERATOR_MAIN__;
        if (!instance || typeof instance.generateSnapshot !== "function") {
          window.setTimeout(runWhenReady, 24);
          return;
        }
        post("planet-map-generator-ready");
        instance
          .generateSnapshot()
          .then((snapshot) => {
            post("planet-map-generator-result", { snapshot });
          })
          .catch((error) => {
            post("planet-map-generator-error", {
              error: error && error.message ? error.message : "Unknown generator error",
            });
          });
      }

      window.addEventListener("load", () => {
        runWhenReady();
      });

      window.addEventListener("error", (event) => {
        post("planet-map-generator-error", {
          error: event && event.message ? event.message : "Generator frame error",
        });
      });

      window.addEventListener("unhandledrejection", (event) => {
        const reason = event && event.reason;
        post("planet-map-generator-error", {
          error: reason && reason.message ? reason.message : String(reason || "Unhandled generator rejection"),
        });
      });
    })();
  </script>
  <script src="./vendor/mapgenerator/bundle.js"></script>
</body>
</html>
